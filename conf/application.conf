play.http.secret.key = "development-secret-key-change-this-before-deployment-0123456789abcdef"
play.http.secret.key = ${?PLAY_HTTP_SECRET}

play.server.http.port = 9000
play.server.http.port = ${?PORT}

pictionary.database {
  url = "jdbc:postgresql://localhost:5432/pictionary"
  url = ${?PICTIONARY_DB_URL}
  user = "pictionary"
  user = ${?PICTIONARY_DB_USER}
  password = "pictionary-development-only"
  password = ${?PICTIONARY_DB_PASSWORD}
}

pictionary.media.directory = "/data/media"
pictionary.media.directory = ${?PICTIONARY_MEDIA_DIRECTORY}

play.filters.hosts {
  allowed = [".localhost", ".127.0.0.1", "192.168.0.2"]
}
