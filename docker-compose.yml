services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-http://localhost:5173}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      PLAY_HTTP_SECRET: development-only-secret-change-me
      PICTIONARY_DB_URL: jdbc:postgresql://postgres:5432/pictionary
      PICTIONARY_DB_USER: pictionary
      PICTIONARY_DB_PASSWORD: pictionary-development-only
      PICTIONARY_MEDIA_DIRECTORY: /data/media
    volumes:
      - .:/workspace
      - sbt-cache:/root/.sbt
      - ivy-cache:/root/.ivy2
      - coursier-cache:/root/.cache/coursier
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pictionary
      POSTGRES_USER: pictionary
      POSTGRES_PASSWORD: pictionary-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictionary -d pictionary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  sbt-cache:
  ivy-cache:
  coursier-cache:
  media-data:
  frontend-node-modules:
